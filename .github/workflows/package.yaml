# Unsigned DATUM Gateway daemons for a human-created git tag.
# Tag: vMAJOR.MINOR.PATCH-federationcoin.<fork> plus optional .alpha/.beta/.rcN
# (same shape as mill/Sparrow; MAJOR.MINOR.PATCH is CMake project VERSION).
# Daemon-only zip per mill OS we can build: linux-x64, linux-arm64,
# macos-arm64, macos-x64. Windows mill extra stays empty (POSIX/epoll).
# CI does not create tags. Do not dispatch this from the test workflow.
# First Package is from the pinned gateway SHA. Cannot overwrite an
# existing tag's Release. Never CONVOY. Dummy MAIN unused. ENABLE_API=OFF.
name: Package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag (vMAJOR.MINOR.PATCH-federationcoin.<fork>, optional .alpha/.beta/.rcN)
        required: true
        type: string

concurrency:
  group: package-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Require FederationCoin gateway tag with no existing Release
        run: |
          set -euo pipefail
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-federationcoin\.[A-Za-z0-9]+(\.(alpha[0-9]*|beta[0-9]*|rc[0-9]+))?$'; then
            echo "tag must match vMAJOR.MINOR.PATCH-federationcoin.<fork> with optional .alpha/.beta/.rcN (got: ${TAG})" >&2
            echo "example: v0.4.1-federationcoin.0 or v0.4.1-federationcoin.0.rc1" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release already exists for ${TAG}; will not overwrite" >&2
            exit 1
          fi
          echo "tag ${TAG} is present and has no GitHub Release"

  build:
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-x64
          - os: ubuntu-22.04-arm
            artifact: linux-arm64
          - os: macos-14
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
    env:
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkgconf python3 \
            libcurl4-openssl-dev libjansson-dev libsodium-dev
      - name: Install Homebrew packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --quiet python@3 || brew link --overwrite python@3
          brew install --quiet cmake ninja pkgconf curl jansson libsodium epoll-shim
      - name: Build unsigned daemon
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "macOS" ]; then
            export PKG_CONFIG_PATH="$(brew --prefix epoll-shim)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          fi
          cmake -B build -G Ninja \
            -DENABLE_API=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix "${PWD}/stage" --strip
          daemon="stage/bin/datum_gateway"
          if [ ! -x "$daemon" ]; then
            echo "missing ${daemon}" >&2
            ls -la stage/bin >&2 || true
            exit 1
          fi
          mkdir -p dist
          python3 .github/scripts/zip-one.py "$daemon" "dist/datum_gateway-${{ matrix.artifact }}.zip"
          ls -la dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  checksums:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f -name '*.zip' | LC_ALL=C sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release binaries found in any artifact" >&2
            exit 1
          fi
          duplicates=$(printf '%s\n' "${files[@]##*/}" | LC_ALL=C sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "The same filename appears in more than one artifact:" >&2
            echo "$duplicates" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            ( cd "$(dirname "$file")" && sha256sum "$(basename "$file")" )
          done | LC_ALL=C sort -k 2 > SHA256SUMS
          echo "$(wc -l < SHA256SUMS) entries"
          cat SHA256SUMS
      - name: Verify the manifest covers every platform
        run: bash .github/scripts/verify-package-manifest.sh SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: SHA256SUMS
          if-no-files-found: error

  draft:
    needs: checksums
    if: ${{ success() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
      - name: Create draft GitHub Release
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \
            \( -name '*.zip' -o -name 'SHA256SUMS' \) | LC_ALL=C sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No assets to attach" >&2
            exit 1
          fi
          gh release create "$TAG" --draft --title "$TAG" \
            --notes "unsigned; not a Guix/Sparrow-signed release" \
            "${files[@]}"
