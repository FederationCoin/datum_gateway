name: Build DATUM Gateway

on:
  pull_request:
    branches:
      - federationcoin
  push:
    branches:
      - federationcoin

env:
  GLOBAL_CFLAGS: "-Wall -Werror"
  ASAN_CFLAGS: "-fsanitize=address"
  ASAN_OPTIONS: "abort_on_error=1:detect_leaks=1:print_stacktrace=1"
  UBSAN_CFLAGS: "-fsanitize=undefined -fno-sanitize-recover=all"
  UBSAN_OPTIONS: "print_stacktrace=1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          # Package linux runners are ubuntu-22.04. The seed image is Debian bookworm.
          # Both ship ENABLE_API=OFF.
          - ubuntu:22.04
          - debian:bookworm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build inside Docker
        run: |
          set -eu
          CMD="set -ex
            apt update && apt install -y git libc6-dev cmake libcurl4-openssl-dev libjansson-dev libsodium-dev pkgconf gcc
            git config --global --add safe.directory /workspace
            mkdir -p build
            cd build
            CFLAGS='${{ env.GLOBAL_CFLAGS }} ${{ env.ASAN_CFLAGS }} ${{ env.UBSAN_CFLAGS }}'
            cmake /workspace -DENABLE_API=OFF -DCMAKE_C_COMPILER=gcc -DCMAKE_C_FLAGS=\"\$CFLAGS\"
            make -j\$(nproc)
            export ASAN_OPTIONS='${{ env.ASAN_OPTIONS }}' UBSAN_OPTIONS='${{ env.UBSAN_OPTIONS }}'
            ./datum_gateway --help
            ./datum_gateway --test
          "
          docker run \
            -v "${{ github.workspace }}:/workspace":ro \
            "${{ matrix.os }}" \
            /bin/sh -c "${CMD}"
